# ═══════════════════════════════════════════════════════════════════════════════
# Technostock — Docker Hub Deployment Compose
# Dipakai di server/VPS: menggunakan image yang sudah di-push ke Docker Hub
# Jalankan: make deploy  atau  <docker|podman> compose -f docker-compose.hub.yml up -d
# Compose file ini kompatibel Docker & Podman (tanpa key khusus salah satu engine).
#
# Sebelum menjalankan:
#   1. Buat file .env untuk setiap service
#   2. Login ke Docker Hub: docker login
#   3. Pull image: make pull  atau  docker compose -f docker-compose.hub.yml pull
# ═══════════════════════════════════════════════════════════════════════════════

name: technostock-hub

# Ubah VERSION sesuai tag yang ingin dipakai (default: latest)
x-image-version: &image-version latest
x-hub-prefix: &hub-prefix daffahaidarnz/technostock

networks:
  technostock-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: technostock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - technostock-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass daffahaidarnz27 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "daffahaidarnz27", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technostock-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: daffahaidar
      RABBITMQ_DEFAULT_PASS: daffahaidarnz27
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - technostock-network

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: daffahaidar
      MINIO_ROOT_PASSWORD: daffahaidarnz27
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - technostock-network

  # ─── auth-service ─────────────────────────────────────────────────────────────

  auth-service:
    image: daffahaidarnz/technostock:auth-service-latest  # ganti 'latest' jika pakai VERSION
    container_name: auth-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./auth-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - MINIO_ENDPOINT=minio
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=daffahaidar
      - RABBITMQ_PASS=daffahaidarnz27
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── grpc-service ─────────────────────────────────────────────────────────────

  grpc-service:
    image: daffahaidarnz/technostock:grpc-service-latest
    container_name: grpc-service
    restart: always
    ports:
      - "50051:50051"
    env_file:
      - ./grpc-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── realtime-service ─────────────────────────────────────────────────────────

  realtime-service:
    image: daffahaidarnz/technostock:realtime-service-latest
    container_name: realtime-service
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./realtime-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=daffahaidar
      - RABBITMQ_PASS=daffahaidarnz27
      - AUTH_GRPC_URL=http://grpc-service:50051
      - MINIO_ENDPOINT=minio
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── main-service ─────────────────────────────────────────────────────────────

  main-service:
    image: daffahaidarnz/technostock:main-service-latest
    container_name: main-service
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./main-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - AUTH_GRPC_URL=grpc-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    image: daffahaidarnz/technostock:frontend-latest
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SERVER_API_URL=http://auth-service:8000
      - SERVER_GATEWAY_URL=http://grpc-service:8080   # server-side: nama service internal
    depends_on:
      - auth-service
      - realtime-service
      - main-service
    networks:
      - technostock-network
