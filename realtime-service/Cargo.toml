[package]
name = "realtime-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
axum = { version = "0.8.1", features = ["ws"] }
futures = "0.3.31"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8.3", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
dotenvy = "0.15.7"
validator = { version = "0.20.0", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
thiserror = "2.0.11"
anyhow = "1.0.95"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.12.1", features = ["serde", "v4"] }
time = "0.3.37"
async-trait = "0.1.89"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1.3"
aws-config = { version = "1.8.14", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.124.0", features = ["behavior-version-latest"] }
futures-util = "0.3.32"
axum_typed_multipart = "0.16.5"
redis = { version = "0.27.6", features = ["tokio-comp", "aio"] }
dashmap = "5.5.3"
lapin = "3.7.2"
deadpool-lapin = "0.13.1"
tokio-amqp = "2.0.0"
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"

