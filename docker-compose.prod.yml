# ═══════════════════════════════════════════════════════════════════════════════
# Technostock Prod — Unified Compose (Docker / Podman)
# Jalankan: make prod  atau  <docker|podman> compose -f docker-compose.prod.yml up --build
# Compose file ini kompatibel Docker & Podman (tanpa key khusus salah satu engine).
# ═══════════════════════════════════════════════════════════════════════════════

name: technostock-prod

networks:
  technostock-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: technostock
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - technostock-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass daffahaidarnz27 --appendonly yes
    volumes:
      - redis_data:/data
    mem_limit: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "daffahaidarnz27", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technostock-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: daffahaidar
      RABBITMQ_DEFAULT_PASS: daffahaidarnz27
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-+A 16"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - technostock-network

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: daffahaidar
      MINIO_ROOT_PASSWORD: daffahaidarnz27
    volumes:
      - minio_data:/data
    mem_limit: 256M
    command: server /data --console-address ":9001"
    networks:
      - technostock-network

  # ─── auth-service ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: auth-service/Dockerfile.unified.prod
    container_name: auth-service
    image: auth-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./auth-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - MALLOC_ARENA_MAX=2
    mem_limit: 64M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── grpc-service ────────────────────────────────────────────────────────────────

  grpc-service:
    build:
      context: .   # Root project — agar folder proto/ dan shared-core tersedia
      dockerfile: grpc-service/Dockerfile.unified.prod
    container_name: grpc-service
    image: grpc-service
    restart: always
    ports:
      - "50051:50051"
      - "8080:8080"
    env_file:
      - ./grpc-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - AUTH_SERVICE_URL=http://auth-service:8000
      - MAIN_SERVICE_URL=http://main-service:8002
      - REALTIME_SERVICE_WS_URL=ws://realtime-service:8001
      - FRONTEND_URL=http://frontend:3000   # nama service internal, bukan localhost
      - MALLOC_ARENA_MAX=2
    mem_limit: 64M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── realtime-service ─────────────────────────────────────────────────────────────

  realtime-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: realtime-service/Dockerfile.unified.prod
    container_name: realtime-service
    image: realtime-service
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./realtime-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=daffahaidar
      - RABBITMQ_PASS=daffahaidarnz27
      - AUTH_GRPC_URL=http://grpc-service:50051
      - MINIO_ENDPOINT=minio
      - MALLOC_ARENA_MAX=2
    mem_limit: 64M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── main-service ────────────────────────────────────────────────────────────

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile.prod
    container_name: main-service
    image: main-service
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./main-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - AUTH_GRPC_URL=grpc-service:50051
      - GOMEMLIMIT=50MiB
      - GOGC=50
    mem_limit: 64M
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend
    image: frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=64
      # Server-side: gunakan nama service internal
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SERVER_API_URL=http://auth-service:8000
      - SERVER_GATEWAY_URL=http://grpc-service:8080   # server-side: nama service internal
    mem_limit: 128M
    depends_on:
      - auth-service
      - realtime-service
      - main-service
    networks:
      - technostock-network
