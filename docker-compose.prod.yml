# ═══════════════════════════════════════════════════════════════════════════════
# Technostock Prod — Unified Docker Compose
# Jalankan: make prod  atau  docker compose -f docker-compose.prod.yml up --build
# ═══════════════════════════════════════════════════════════════════════════════

name: technostock-prod

networks:
  technostock-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: technostock-postgres-prod
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: technostock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - technostock-network

  redis:
    image: redis:7-alpine
    container_name: technostock-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass daffahaidarnz27 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "daffahaidarnz27", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technostock-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: technostock-rabbitmq-prod
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: daffahaidar
      RABBITMQ_DEFAULT_PASS: daffahaidarnz27
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - technostock-network

  minio:
    image: quay.io/minio/minio
    container_name: technostock-minio-prod
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: daffahaidar
      MINIO_ROOT_PASSWORD: daffahaidarnz27
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - technostock-network

  # ─── auth-service ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: auth-service/Dockerfile.unified.prod
    container_name: technostock-auth-service-prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./auth-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - MINIO_ENDPOINT=minio
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── grpc-service ────────────────────────────────────────────────────────────────

  grpc-service:
    build:
      context: .   # Root project — agar folder proto/ dan shared-core tersedia
      dockerfile: grpc-service/Dockerfile.unified.prod
    container_name: technostock-grpc-service-prod
    restart: always
    ports:
      - "50051:50051"
    env_file:
      - ./grpc-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── realtime-service ─────────────────────────────────────────────────────────────

  realtime-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: realtime-service/Dockerfile.unified.prod
    container_name: technostock-realtime-service-prod
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./realtime-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - AUTH_GRPC_URL=http://grpc-service:50051
      - MINIO_ENDPOINT=minio
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── main-service ────────────────────────────────────────────────────────────

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile.prod
    container_name: technostock-main-service-prod
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./main-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - AUTH_GRPC_URL=grpc-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: technostock-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side: gunakan nama service internal
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SERVER_API_URL=http://auth-service:8000
    depends_on:
      - auth-service
      - realtime-service
      - main-service
    networks:
      - technostock-network
