# ═══════════════════════════════════════════════════════════════════════════════
# Technostock Dev — Unified Docker Compose
# Jalankan: make dev  atau  docker compose -f docker-compose.dev.yml up --build
# ═══════════════════════════════════════════════════════════════════════════════

name: technostock-dev

networks:
  technostock-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:
  auth-service-cargo-cache:
  auth-service-target-cache:
  grpc-service-cargo-cache:
  grpc-service-target-cache:
  realtime-service-cargo-cache:
  realtime-service-target-cache:
  main-service-go-cache:
  main-service-go-mod-cache:
  next_cache:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: technostock
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - technostock-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass daffahaidarnz27 --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "daffahaidarnz27", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technostock-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: daffahaidar
      RABBITMQ_DEFAULT_PASS: daffahaidarnz27
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-+A 16"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - technostock-network

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: daffahaidar
      MINIO_ROOT_PASSWORD: daffahaidarnz27
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    command: server /data --console-address ":9001"
    networks:
      - technostock-network

  # ─── auth-service ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: auth-service/Dockerfile.unified.dev
    container_name: auth-service
    image: auth-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./auth-service:/app
      - ./shared-core:/shared-core
      - ./proto:/proto  # Proto juga di-mount agar cargo-watch bisa detect perubahan
      - auth-service-cargo-cache:/usr/local/cargo/registry
      - auth-service-target-cache:/app/target
    env_file:
      - ./auth-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SQLX_OFFLINE=false
      - MALLOC_ARENA_MAX=2
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    # Jalankan migrasi dulu, baru start dengan hot-reload
    command: sh -c "sqlx migrate run && cargo watch -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  grpc-service:
    build:
      context: .   # Root project — agar folder proto/ dan shared-core tersedia
      dockerfile: grpc-service/Dockerfile.unified.dev
    container_name: grpc-service
    image: grpc-service
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - ./grpc-service:/app
      - ./shared-core:/shared-core
      - ./proto:/proto
      - grpc-service-cargo-cache:/usr/local/cargo/registry
      - grpc-service-target-cache:/app/target
    env_file:
      - ./grpc-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SQLX_OFFLINE=false
      - AUTH_SERVICE_URL=http://auth-service:8000
      - MAIN_SERVICE_URL=http://main-service:8002
      - REALTIME_SERVICE_WS_URL=ws://realtime-service:8001
      - MALLOC_ARENA_MAX=2
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    command: sh -c "cargo watch -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technostock-network

  # ─── realtime-service ─────────────────────────────────────────────────────────────

  realtime-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: realtime-service/Dockerfile.unified.dev
    container_name: realtime-service
    image: realtime-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./realtime-service:/app
      - ./proto:/proto  # Proto juga di-mount agar cargo-watch bisa detect perubahan
      - realtime-service-cargo-cache:/usr/local/cargo/registry
      - realtime-service-target-cache:/app/target
    env_file:
      - ./realtime-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - AUTH_GRPC_URL=http://grpc-service:50051
      - MINIO_ENDPOINT=minio
      - SQLX_OFFLINE=false
      - MALLOC_ARENA_MAX=2
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    # Jalankan migrasi dulu, baru start dengan hot-reload
    command: sh -c "sqlx migrate run && cargo watch -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── main-service ────────────────────────────────────────────────────────────

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile.dev
    container_name: main-service
    image: main-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./main-service:/app
      - main-service-go-cache:/root/.cache/go-build
      - main-service-go-mod-cache:/go/pkg/mod
    env_file:
      - ./main-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - AUTH_GRPC_URL=grpc-service:50051
      - GOMEMLIMIT=100MiB
      - GOGC=50
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - technostock-network

  # ─── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    image: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    env_file:
      - ./frontend/.env.development
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # - NODE_OPTIONS=--max-old-space-size=256
      # Server-side: gunakan nama service internal
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/technostock
      - SERVER_API_URL=http://auth-service:8000
      - BETTER_AUTH_URL=http://localhost:3000
      # Client-side (browser): tetap localhost karena diakses dari browser user
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_API_URL=ws://localhost:8080
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    depends_on:
      - auth-service
      - realtime-service
      - main-service
    networks:
      - technostock-network
