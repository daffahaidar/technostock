# ═══════════════════════════════════════════════════════════════════════════════
# AngelTrade Dev — Unified Compose (Docker / Podman)
# Jalankan: make dev  atau  <docker|podman> compose -f docker-compose.dev.yml up --build
# Compose file ini kompatibel Docker & Podman (tanpa key khusus salah satu engine).
# ═══════════════════════════════════════════════════════════════════════════════

name: angeltrade-dev

networks:
  angeltrade-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  minio_data:
  kafka_data:
  auth-service-cargo-cache:
  auth-service-target-cache:
  grpc-service-cargo-cache:
  grpc-service-target-cache:
  realtime-service-cargo-cache:
  realtime-service-target-cache:
  main-service-go-cache:
  main-service-go-mod-cache:
  next_cache:

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: angeltrade
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - angeltrade-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass daffahaidarnz27 --appendonly yes
    volumes:
      - redis_data:/data
    mem_limit: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "daffahaidarnz27", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - angeltrade-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: daffahaidar
      RABBITMQ_DEFAULT_PASS: daffahaidarnz27
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-+A 16"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - angeltrade-network

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: daffahaidar
      MINIO_ROOT_PASSWORD: daffahaidarnz27
    volumes:
      - minio_data:/data
    mem_limit: 256M
    command: server /data --console-address ":9001"
    networks:
      - angeltrade-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092" # host clients (SASL_PLAINTEXT)
    environment:
      # KRaft single node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # SASL/PLAIN credentials (inline JAAS, tanpa file config tambahan)
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_HOST_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="daffahaidar" password="daffahaidarnz27" user_daffahaidar="daffahaidarnz27";'
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="daffahaidar" password="daffahaidarnz27" user_daffahaidar="daffahaidarnz27";'
      # single-node defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx320m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 512M
    networks:
      - angeltrade-network

  # ─── auth-service ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: auth-service/Dockerfile.unified.dev
    container_name: auth-service
    image: auth-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./auth-service:/app
      - ./shared-core:/shared-core
      - ./proto:/proto  # Proto juga di-mount agar cargo-watch bisa detect perubahan
      - auth-service-cargo-cache:/usr/local/cargo/registry
      - auth-service-target-cache:/app/target
    env_file:
      - ./auth-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/angeltrade
      - SQLX_OFFLINE=false
      - MALLOC_ARENA_MAX=2
    # mem_limit: 1G
    # Jalankan migrasi dulu, baru start dengan hot-reload
    command: sh -c "sqlx migrate run --ignore-missing && cargo watch --poll -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - angeltrade-network

  grpc-service:
    build:
      context: .   # Root project — agar folder proto/ dan shared-core tersedia
      dockerfile: grpc-service/Dockerfile.unified.dev
    container_name: grpc-service
    image: grpc-service
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - ./grpc-service:/app
      - ./shared-core:/shared-core
      - ./proto:/proto
      - grpc-service-cargo-cache:/usr/local/cargo/registry
      - grpc-service-target-cache:/app/target
    env_file:
      - ./grpc-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/angeltrade
      - SQLX_OFFLINE=false
      - AUTH_SERVICE_URL=http://auth-service:8000
      - MAIN_SERVICE_URL=http://main-service:8002
      - REALTIME_SERVICE_WS_URL=ws://realtime-service:8001
      - FRONTEND_URL=http://frontend:3000   # nama service internal, bukan localhost
      - MALLOC_ARENA_MAX=2
    # mem_limit: 1G
    command: sh -c "cargo watch --poll -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - angeltrade-network

  # ─── realtime-service ─────────────────────────────────────────────────────────────

  realtime-service:
    build:
      context: .   # Root project — agar folder proto/ tersedia untuk build.rs
      dockerfile: realtime-service/Dockerfile.unified.dev
    container_name: realtime-service
    image: realtime-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./realtime-service:/app
      - ./proto:/proto  # Proto juga di-mount agar cargo-watch bisa detect perubahan
      - realtime-service-cargo-cache:/usr/local/cargo/registry
      - realtime-service-target-cache:/app/target
    env_file:
      - ./realtime-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/angeltrade
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=daffahaidar
      - RABBITMQ_PASS=daffahaidarnz27
      - AUTH_GRPC_URL=http://grpc-service:50051
      - MINIO_ENDPOINT=minio
      # URL publik harus localhost: dipakai browser, bukan koneksi internal.
      - MINIO_PUBLIC_URL=http://localhost:9000
      - SQLX_OFFLINE=false
      - MALLOC_ARENA_MAX=2
    # mem_limit: 1G
    # Jalankan migrasi dulu, baru start dengan hot-reload.
    # --ignore-missing: DB `angeltrade` (dan tabel _sqlx_migrations) dipakai
    # bersama auth-service, jadi migrasi milik service lain harus di-skip.
    command: sh -c "sqlx migrate run --ignore-missing && cargo watch --poll -c -x run"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - angeltrade-network

  # ─── main-service ────────────────────────────────────────────────────────────

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile.dev
    container_name: main-service
    image: main-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./main-service:/app
      - main-service-go-cache:/root/.cache/go-build
      - main-service-go-mod-cache:/go/pkg/mod
    env_file:
      - ./main-service/.env
    environment:
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/angeltrade
      - AUTH_GRPC_URL=grpc-service:50051
      - GOMEMLIMIT=100MiB
      - GOGC=50
    # 1G, bukan 200M: di mode dev `air` meng-compile Go DI DALAM container, dan
    # go compiler butuh ~600MB+ untuk paket seperti pgx. Dengan 200M compiler
    # kena OOM-kill ("compile: signal: killed" → "/app/tmp/main: not found").
    # GOMEMLIMIT di atas hanya membatasi runtime app-nya, bukan proses compiler.
    # Limit 64M di docker-compose.prod.yml tetap aman karena build di stage terpisah.
    mem_limit: 1G
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      grpc-service:
        condition: service_started
    networks:
      - angeltrade-network

  # ─── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    image: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    env_file:
      - ./frontend/.env.development
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # - NODE_OPTIONS=--max-old-space-size=256
      # Server-side: gunakan nama service internal
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/angeltrade
      - SERVER_API_URL=http://auth-service:8000
      - SERVER_GATEWAY_URL=http://grpc-service:8080   # server-side: nama service internal
      - BETTER_AUTH_URL=http://localhost:3000
      # Client-side (browser): tetap localhost karena diakses dari browser user
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_API_URL=ws://localhost:8080
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    # mem_limit: 512M
    depends_on:
      - auth-service
      - realtime-service
      - main-service
    networks:
      - angeltrade-network
